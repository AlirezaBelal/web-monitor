name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py web_monitor.py notifications.py health.py tests

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Validate tracked configurations
        run: |
          python main.py --config config.example.json --validate-config
          python main.py --config deploy/config.container.example.json --validate-config
          python main.py --config deploy/config.systemd.example.json --validate-config

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "coverage>=7.10" ruff

      - name: Run Ruff correctness checks
        run: ruff check --select E9,F63,F7,F82 .

      - name: Enforce test coverage
        run: |
          coverage erase
          coverage run -m unittest discover -s tests -v
          coverage combine
          coverage report --show-missing --fail-under=80

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit core dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit optional desktop dependencies
        run: python -m pip_audit -r requirements-desktop.txt

  container:
    name: Docker build and runtime
    runs-on: ubuntu-latest
    needs: [test, quality, security-audit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t webmonitor-ci .

      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id webmonitor-ci -u)"
          test "$uid" != "0"

      - name: Validate container configuration
        run: |
          docker run --rm \
            -v "$PWD/deploy/config.container.example.json:/config/config.json:ro" \
            webmonitor-ci --config /config/config.json --validate-config
